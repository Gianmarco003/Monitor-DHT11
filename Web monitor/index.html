<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sensor Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1>Sensor Monitoring</h1>

    <div class="panel">
      <h2>Temperature: <span id="temp-value">Loading...</span> °C</h2>
      <h2>Humidity: <span id="hum-value">Loading...</span> %</h2>
      <h2>Light: <span id="light-value">Loading...</span> lux</h2>
      <p>Last update: <span id="update-value">Waiting...</span></p>
    </div>

    <script src="./config.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
